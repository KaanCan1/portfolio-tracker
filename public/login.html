<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giriş · Portfolio</title>
  <link rel="icon" href="/brand.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#0c1016" />
  <style>
    /* 13 Eki 2026: giriş ekranı da portföy terminalinin nötr, keskin yüzeylerini kullanır. */
    :root { color-scheme:dark; --bg:#0c1016; --card:#121821; --ink:#e7edf5; --muted:#8e9eb3; --line:#293344; --accent:#8ab5ff; --red:#ff7c88; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--ink); min-height:100dvh; display:grid; place-items:center; padding:20px; -webkit-font-smoothing:antialiased; }
    .login { width:100%; max-width:380px; padding:28px; background:var(--card); border:1px solid var(--line); border-top:2px solid var(--accent); border-radius:4px; }
    .brand { display:flex; align-items:center; gap:12px; margin-bottom:28px; }
    .logo { width:36px; height:36px; border-radius:3px; display:grid; place-items:center; color:#fff; background:#335eea; }
    .logo svg { width:22px; height:22px; }
    .brand h1 { font-size:15px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
    .brand span { display:block; margin-top:4px; color:var(--muted); font-size:11px; }
    label { display:block; font-size:12px; font-weight:600; margin-bottom:8px; }
    .field { position:relative; }
    input { width:100%; min-height:48px; font:inherit; font-size:16px; color:var(--ink); padding:12px 70px 12px 12px; border:1px solid #3c4b61; border-radius:3px; background:var(--bg); }
    input:focus { outline:2px solid #8ab5ff40; border-color:var(--accent); }
    .toggle { position:absolute; right:4px; top:50%; transform:translateY(-50%); min-height:44px; padding:6px 10px; border:0; border-radius:3px; background:transparent; cursor:pointer; color:var(--muted); font:inherit; font-size:12px; }
    .toggle:hover { color:var(--ink); background:#191f29; }
    button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    button.submit { width:100%; margin-top:16px; min-height:46px; border:1px solid #527aff; border-radius:3px; padding:12px; cursor:pointer; font:inherit; font-weight:600; font-size:13px; background:#335eea; color:#fff; }
    button.submit:hover { background:#416df4; }
    button.submit:disabled { opacity:.6; cursor:wait; }
    .err { display:none; margin-top:14px; padding:11px 12px; font-size:12px; line-height:1.5; color:var(--red); background:#302027; border:1px solid #60404a; border-radius:3px; }
    .err.show { display:block; }
    .foot { margin-top:24px; padding-top:16px; border-top:1px solid var(--line); font-size:11px; color:var(--muted); line-height:1.5; }
  </style>
</head>
<body>
  <form class="login" id="loginForm" autocomplete="off">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 15.5 L10 9.5 L13.5 13 L20 6.5" />
          <path d="M15 6.5 H20 V11.5" />
        </svg>
      </div>
      <div>
        <h1>Portföy</h1>
        <span>Yatırım terminali · kişisel erişim</span>
      </div>
    </div>
    <label for="pw">Şifre</label>
    <div class="field">
      <input type="password" id="pw" name="password" placeholder="••••••••" required autofocus />
      <button type="button" class="toggle" id="toggle">Göster</button>
    </div>
    <button type="submit" class="submit" id="submitBtn">Giriş Yap</button>
    <div class="err" id="err">Şifre hatalı, tekrar dene.</div>
    <div class="foot">Bu pano kişiseldir. Oturum 30 gün açık kalır.</div>
  </form>

  <script>
    const form = document.getElementById("loginForm");
    const pw = document.getElementById("pw");
    const err = document.getElementById("err");
    const btn = document.getElementById("submitBtn");
    document.getElementById("toggle").addEventListener("click", () => {
      const show = pw.type === "password";
      pw.type = show ? "text" : "password";
      document.getElementById("toggle").textContent = show ? "Gizle" : "Göster";
      pw.focus();
    });
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.classList.remove("show");
      btn.disabled = true; btn.textContent = "Kontrol ediliyor…";
      try {
        const r = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: pw.value }),
        });
        if (r.ok) { window.location.href = "/"; return; }
        err.classList.add("show");
      } catch { err.textContent = "Bağlantı hatası, tekrar dene."; err.classList.add("show"); }
      btn.disabled = false; btn.textContent = "Giriş Yap";
      pw.select();
    });
  </script>
</body>
</html>
